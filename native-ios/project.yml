name: PixEzNative

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  PixEzNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NativePixEz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.283gawin.pixez.native
        INFOPLIST_FILE: NativePixEz/Resources/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      gatherCoverageData: false